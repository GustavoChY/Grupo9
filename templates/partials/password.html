{% extends "app.html" %}
{% block main %}
<div class="titulo-pagina"><h1>Cambiar contraseña</h1></div>
<form method="post" class="tarjeta" style="max-width:480px"><div class="cuerpo">{% csrf_token %}
  <div class="mb-3"><label class="form-label small fw-semibold">Contraseña actual</label><input class="form-control" type="password" name="actual" required></div>
  <div class="mb-3"><label class="form-label small fw-semibold">Nueva contraseña</label><input class="form-control" type="password" name="nueva" required><div class="ayuda">Mínimo 8 caracteres, con letras y números.</div></div>
  <div class="mb-3"><label class="form-label small fw-semibold">Repita la nueva</label><input class="form-control" type="password" name="nueva2" required></div>
  <button class="btn btn-primary">Actualizar</button></div></form>
{% endblock %}
