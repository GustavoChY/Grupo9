{% extends "app.html" %}{% load ui %}
{% block main %}
<div class="titulo-pagina"><div><h1>Notificaciones</h1><div class="sub">{{ sin_leer }} sin leer</div></div>
  {% if sin_leer %}<form method="post">{% csrf_token %}<button class="btn btn-outline-primary btn-sm"><i class="bi bi-check2-all"></i> Marcar todas como leídas</button></form>{% endif %}</div>
<div class="tarjeta overflow-hidden">
  {% for n in lista %}<a class="notif {% if not n.leida %}nueva{% endif %}" href="{{ n.url|default:'#' }}"><span class="pto"></span><div><div>{{ n.mensaje }}</div><small class="text-muted">{{ n.creado_en|fechahora }}</small></div></a>
  {% empty %}<div class="vacio"><i class="bi bi-bell-slash"></i>No tiene notificaciones.</div>{% endfor %}
</div>{% endblock %}
